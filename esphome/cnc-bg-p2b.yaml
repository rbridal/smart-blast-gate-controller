script:
  - id: correct_cnc_to_open
    mode: single
    then:
      - logger.log: "CNC align correction → open"
      - if:
          condition:
            lambda: 'return id(actual_cnc).state == "unknown";'
          then:
            - script.execute: write_cnc_closed
            - script.wait: write_cnc_closed
      - script.execute: write_cnc_open
      - script.wait: write_cnc_open

  - id: correct_cnc_to_closed
    mode: single
    then:
      - logger.log: "CNC align correction → closed"
      # Last open gate (hose already closed/desired closed) → vac coast-down
      - if:
          condition:
            switch.is_off: valve_hose
          then:
            - delay: !lambda |-
                return (uint32_t)(id(last_gate_close_delay_s).state * 1000.0f);
      - if:
          condition:
            lambda: 'return id(actual_cnc).state == "unknown";'
          then:
            - script.execute: write_cnc_open
            - script.wait: write_cnc_open
      - script.execute: write_cnc_closed
      - script.wait: write_cnc_closed

  - id: correct_hose_to_open
    mode: single
    then:
      - logger.log: "Hose align correction → open"
      - if:
          condition:
            lambda: 'return id(actual_hose).state == "unknown";'
          then:
            - script.execute: write_hose_closed
            - script.wait: write_hose_closed
      - script.execute: write_hose_open
      - script.wait: write_hose_open

  - id: correct_hose_to_closed
    mode: single
    then:
      - logger.log: "Hose align correction → closed"
      - if:
          condition:
            switch.is_off: valve_cnc
          then:
            - delay: !lambda |-
                return (uint32_t)(id(last_gate_close_delay_s).state * 1000.0f);
      - if:
          condition:
            lambda: 'return id(actual_hose).state == "unknown";'
          then:
            - script.execute: write_hose_open
            - script.wait: write_hose_open
      - script.execute: write_hose_closed
      - script.wait: write_hose_closed
