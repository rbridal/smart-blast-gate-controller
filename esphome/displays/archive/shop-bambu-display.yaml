                        border_width: 1
                        border_color: col_line
                        radius: 6
                        pad_all: 2
                        widgets:
                          - obj:
                              id: ams1_swatch
                              align: TOP_MID
                              y: 2
                              width: 36
                              height: 28
                              radius: 4
                              bg_color: col_empty
                              bg_opa: COVER
                              border_width: 0
                          - label:
                              id: ams1_weight_lbl
                              align: BOTTOM_MID
                              y: -2
