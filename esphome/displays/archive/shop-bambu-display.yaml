                    - obj:
                        id: ams2_ring
                        width: 48
                        height: 60
                        bg_opa: TRANSP
                        border_width: 1
                        border_color: col_line
                        radius: 6
                        pad_all: 2
                        widgets:
                          - obj:
                              id: ams2_swatch
                              align: TOP_MID
                              y: 2
                              width: 36
                              height: 28
                              radius: 4
                              bg_color: col_empty
                              bg_opa: COVER
                              border_width: 0
                          - label:
                              id: ams2_weight_lbl
                              align: BOTTOM_MID
                              y: -2
                              text: "-"
                              text_font: font_ams
                              text_color: col_text
                    - obj:
                        id: ams3_ring
                        width: 48
                        height: 60
                        bg_opa: TRANSP
                        border_width: 1
                        border_color: col_line
                        radius: 6
                        pad_all: 2
                        widgets:
                          - obj:
                              id: ams3_swatch
                              align: TOP_MID
                              y: 2
                              width: 36
                              height: 28
                              radius: 4
                              bg_color: col_empty
                              bg_opa: COVER
                              border_width: 0
                          - label:
                              id: ams3_weight_lbl
                              align: BOTTOM_MID
                              y: -2
                              text: "-"
                              text_font: font_ams
                              text_color: col_text
                    - obj:
                        id: ams4_ring
