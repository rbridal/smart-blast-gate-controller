substitutions:
  name: "smart-blast-gate-display"
  friendly_name: "Smart Blast Gate Display"
  # cnc_valve_entity: "input_boolean.tmp_cnc_switch"
  # hose_valve_entity: "input_boolean.tmp_hose_switch"
  cnc_valve_entity: "switch.smart_blast_gate_cnc_blast_gate"
  hose_valve_entity: "switch.smart_blast_gate_hose_blast_gate"
  cnc_on_button: "button.dust_collection_cnc_on"
  cnc_off_button: "button.dust_collection_cnc_off"
  hose_on_button: "button.dust_collection_hose_on"
  hose_off_button: "button.dust_collection_hose_off"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# In Home Assistant: device settings → enable
# "Allow the device to perform Home Assistant actions"
# so the tap can call button.press.
api:
  encryption:
    key: !secret smart_blast_gate_display__encryption_key

ota:
  - platform: esphome
    password: !secret smart_blast_gate_display__encryption_key

safe_mode:

wifi:
  networks:
    - id: wifi_house
      ssid: !secret wifi_ssid_house
      password: !secret wifi_password_house
    - id: wifi_shop
      ssid: !secret wifi_ssid_shop
      password: !secret wifi_password_shop

i2c:
  id: i2c_bus
  sda: GPIO15
  scl: GPIO14
  scan: true

spi:
  - id: display_spi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    bus_mode: quad
    reset_pin: GPIO39
    cs_pin: GPIO12
    dimensions:
      height: "466"
      width: "466"
      offset_height: 0
      offset_width: 7

light:
  - platform: monochromatic
    id: display_backlight
    name: "Backlight"
    output: backlight_brightness
    default_transition_length:
      milliseconds: 0
    initial_state:
      brightness: 81%
    restore_mode:
      ALWAYS_ON

output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      then:
        - lambda: |-
            id(disp1).set_brightness(state * 255);

touchscreen:
  - platform: cst9220
    display: disp1
    id: ts_disp1
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true

font:
  - file:
      type: gfonts
      family: "Roboto"
      weight: black
    id: font_hero
    size: 96
    bpp: 4

color:
  - id: fgcolor_on
    hex: "FFFFFF"
  - id: fgcolor_off
    hex: "505050"
  - id: bgcolor_off
    hex: "000000"
  # Bambu Green (#00AE42); Festool RAL 6018 is in the same family
  - id: bgcolor_cnc_on
    hex: "00AE42"
  - id: bgcolor_hose_on
    hex: "6495ED"

script:
  - id: update_split_line
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: cnc_valve
              - binary_sensor.is_on: hose_valve
          then:
            - lvgl.widget.update:
                id: split_line
                bg_color: fgcolor_on
          else:
            - lvgl.widget.update:
                id: split_line
                bg_color: fgcolor_off

  # mode: single + trailing delay = ignore double-taps while gate is moving
  - id: cnc_tap
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: cnc_valve
          then:
            # Closing — optimistic UI, then absolute OFF
            - lvgl.widget.update:
                id: cnc_panel
                bg_color: bgcolor_off
            - lvgl.widget.update:
                id: cnc_label
                text_color: fgcolor_off
            - if:
                condition:
                  binary_sensor.is_on: hose_valve
                then:
                  - lvgl.widget.update:
                      id: split_line
                      bg_color: fgcolor_on
                else:
                  - lvgl.widget.update:
                      id: split_line
                      bg_color: fgcolor_off
            - logger.log: "CNC tap — close (debounced)"
            - homeassistant.action:
                action: button.press
                data:
                  entity_id: ${cnc_off_button}
          else:
            # Opening — optimistic UI, then absolute ON
            - lvgl.widget.update:
                id: cnc_panel
                bg_color: bgcolor_cnc_on
            - lvgl.widget.update:
                id: cnc_label
                text_color: fgcolor_on
            - lvgl.widget.update:
                id: split_line
                bg_color: fgcolor_on
            - logger.log: "CNC tap — open (debounced)"
            - homeassistant.action:
                action: button.press
                data:
                  entity_id: ${cnc_on_button}
      - delay: 2s

  - id: hose_tap
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: hose_valve
          then:
            - lvgl.widget.update:
                id: hose_panel
                bg_color: bgcolor_off
            - lvgl.widget.update:
                id: hose_label
                text_color: fgcolor_off
            - if:
                condition:
                  binary_sensor.is_on: cnc_valve
                then:
                  - lvgl.widget.update:
                      id: split_line
                      bg_color: fgcolor_on
                else:
                  - lvgl.widget.update:
                      id: split_line
                      bg_color: fgcolor_off
            - logger.log: "Hose tap — close (debounced)"
            - homeassistant.action:
                action: button.press
                data:
                  entity_id: ${hose_off_button}
          else:
            - lvgl.widget.update:
                id: hose_panel
                bg_color: bgcolor_hose_on
            - lvgl.widget.update:
                id: hose_label
                text_color: fgcolor_on
            - lvgl.widget.update:
                id: split_line
                bg_color: fgcolor_on
            - logger.log: "Hose tap — open (debounced)"
            - homeassistant.action:
                action: button.press
                data:
                  entity_id: ${hose_on_button}
      - delay: 2s

binary_sensor:
  - platform: homeassistant
    id: cnc_valve
    entity_id: ${cnc_valve_entity}
    publish_initial_state: true
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: cnc_valve
            then:
              - lvgl.widget.update:
                  id: cnc_panel
                  bg_color: bgcolor_cnc_on
              - lvgl.widget.update:
                  id: cnc_label
                  text_color: fgcolor_on
            else:
              - lvgl.widget.update:
                  id: cnc_panel
                  bg_color: bgcolor_off
              - lvgl.widget.update:
                  id: cnc_label
                  text_color: fgcolor_off
        - script.execute: update_split_line
  - platform: homeassistant
    id: hose_valve
    entity_id: ${hose_valve_entity}
    publish_initial_state: true
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: hose_valve
            then:
              - lvgl.widget.update:
                  id: hose_panel
                  bg_color: bgcolor_hose_on
              - lvgl.widget.update:
                  id: hose_label
                  text_color: fgcolor_on
            else:
              - lvgl.widget.update:
                  id: hose_panel
                  bg_color: bgcolor_off
              - lvgl.widget.update:
                  id: hose_label
                  text_color: fgcolor_off
        - script.execute: update_split_line

lvgl:
  id: lvgl1
  displays:
    - disp1
  touchscreens:
    - ts_disp1
  rotation: 90
  full_refresh: true
  buffer_size: 100%
  color_depth: 16
  bg_color: bgcolor_off
  default_font: font_hero
  log_level: WARN
  style_definitions:
    - id: panel_style
      border_width: 0
      outline_width: 0
      pad_all: 0
      radius: 0
      bg_opa: COVER
    - id: label_style
      border_width: 0
      outline_width: 0
      pad_all: 0
      radius: 0
      bg_opa: TRANSP
      text_color: fgcolor_off
      text_align: CENTER
  pages:
    - id: gates_page
      bg_color: bgcolor_off
      scrollable: false
      scrollbar_mode: "OFF"
      scroll_chain: false
      layout:
        type: FLEX
        flex_flow: COLUMN
        pad_row: 0
      widgets:
        # Top half: CNC. Text reads left-to-right after LVGL 90° rotation.
        - obj:
            id: cnc_panel
            styles: panel_style
            width: 100%
            flex_grow: 1
            bg_color: bgcolor_off
            clickable: true
            scrollable: false
            scrollbar_mode: "OFF"
            scroll_chain: false
            on_short_click:
              then:
                - script.execute: cnc_tap
            widgets:
              - label:
                  id: cnc_label
                  styles: label_style
                  align: CENTER
                  text: "CNC"
                  text_font: font_hero
                  text_color: fgcolor_off
                  text_align: CENTER
                  clickable: true
                  scrollable: false
                  scrollbar_mode: "OFF"
                  scroll_chain: false
                  on_short_click:
                    then:
                      - script.execute: cnc_tap
        # Divider: fgcolor_on if either valve is open, fgcolor_off if both are closed
        - obj:
            id: split_line
            width: 100%
            height: 4
            pad_all: 0
            radius: 0
            border_width: 0
            outline_width: 0
            bg_color: fgcolor_off
            bg_opa: COVER
            clickable: false
            scrollable: false
            scrollbar_mode: "OFF"
            scroll_chain: false
        # Bottom half: Hose. Text reads left-to-right.
        - obj:
            id: hose_panel
            styles: panel_style
            width: 100%
            flex_grow: 1
            bg_color: bgcolor_off
            clickable: true
            scrollable: false
            scrollbar_mode: "OFF"
            scroll_chain: false
            on_short_click:
              then:
                - script.execute: hose_tap
            widgets:
              - label:
                  id: hose_label
                  styles: label_style
                  align: CENTER
                  text: "HOSE"
                  text_font: font_hero
                  text_color: fgcolor_off
                  text_align: CENTER
                  clickable: true
                  scrollable: false
                  scrollbar_mode: "OFF"
                  scroll_chain: false
                  on_short_click:
                    then:
                      - script.execute: hose_tap
