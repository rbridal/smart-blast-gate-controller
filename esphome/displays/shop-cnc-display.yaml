substitutions:
  name: "shop-cnc-display"
  friendly_name: "Shop CNC Display"
  cnc_state_entity: "binary_sensor.shop_cnc_display_cnc_state"
  spindle_active_entity: "binary_sensor.shop_cnc_display_spindle_active"
  blast_gate_entity: "binary_sensor.shop_cnc_display_blast_gate"
  override_entity: "binary_sensor.shop_cnc_display_override"
  shop_vac_entity: "binary_sensor.shop_cnc_display_shop_vac"
  spindle_power_entity: "sensor.shop_cnc_display_spindle_power"
  spindle_voltage_entity: "sensor.shop_cnc_display_spindle_voltage"
  spindle_current_entity: "sensor.shop_cnc_display_spindle_current"
  override_toggle_entity: "button.shop_cnc_display_override_toggle"
  cnc_gate_actual_entity: "sensor.smart_blast_gate_controller_cnc_actual"
  hose_gate_actual_entity: "sensor.smart_blast_gate_controller_hose_actual"
  # v1.3.1: HA template helper that picks the most recently reported of the
  # Shelly plug's 1 s pushed "Vac Fast Power" and its stock power sensor, and
  # reads 0 when the vac switch is off. Falls back to the stock sensor if the
  # on-plug fast_power script stops.
  vac_power_entity: "sensor.shop_cnc_display_vac_power"
  # Tunables (also exposed in HA as number entities: "Start Window",
  # "Vac Run Threshold", "Stop Settle", "Stop Stuck Timeout", "Moving Settle").
  # These are only the first-boot defaults; after that the value set in HA is
  # restored across reboots.
  start_window_s: "15"
  vac_run_threshold_w: "400"
  stop_settle_s: "5"
  stop_stuck_s: "60"
  moving_settle_s: "2"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: "2026.9.0"
  project:
    name: "delrob.shop-cnc-display"
    version: "1.3.1"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

logger:

# Device settings → enable "Allow the device to perform Home Assistant actions"
api:
  encryption:
    key: !secret shop_cnc_display__encryption_key
  on_client_connected:
    then:
      - script.execute: refresh_ui

ota:
  - platform: esphome
    password: !secret shop_cnc_display__encryption_key

safe_mode:

wifi:
  networks:
    - id: wifi_house
      ssid: !secret wifi_ssid_house
      password: !secret wifi_password_house
    - id: wifi_shop
      ssid: !secret wifi_ssid_shop
      password: !secret wifi_password_shop

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic
  - platform: homeassistant
    id: cnc_state
    entity_id: ${cnc_state_entity}
    trigger_on_initial_state: true
    on_state:
      then:
        - script.execute: refresh_ui
  - platform: homeassistant
    id: spindle_active
    entity_id: ${spindle_active_entity}
    trigger_on_initial_state: true
    on_state:
      then:
        # Start-window clock starts on the off->on edge only, so an HA
        # reconnect that re-sends "on" doesn't restart STARTING mid-job.
        # The on->off edge starts the STOPPING phase. Spindle back on during
        # STOPPING cancels it and gets a fresh start window.
        - lambda: |-
            if (x && !id(spindle_was_on)) {
              id(spindle_on_ms) = millis();
              if (id(stop_active)) ESP_LOGI("ui", "Spindle on during STOPPING: cancel stop");
              id(stop_active) = false;
              ESP_LOGI("ui", "Spindle on: start window begins");
            } else if (!x && id(spindle_was_on)) {
              id(stop_active) = true;
              id(stop_start_ms) = millis();
              ESP_LOGI("ui", "Spindle off: STOPPING begins");
            }
            id(spindle_was_on) = x;
        - script.execute: refresh_ui
  - platform: homeassistant
    id: blast_gate
    entity_id: ${blast_gate_entity}
    trigger_on_initial_state: true
    on_state:
      then:
        - script.execute: refresh_ui
  - platform: homeassistant
    id: override_state
    entity_id: ${override_entity}
    trigger_on_initial_state: true
    on_state:
      then:
        - script.execute: refresh_ui
  - platform: homeassistant
    id: shop_vac
    entity_id: ${shop_vac_entity}
    trigger_on_initial_state: true
    on_state:
      then:
        - script.execute: refresh_ui

# ---------------------------------------------------------------------------
# Status model (v1.3.0). Priority, first match wins:
#   1 NO DUST    red     spindle on, override off, start window expired, and
#                        the CNC gate actual isn't "open" or the vac isn't
#                        drawing power (>= Vac Run Threshold)
#   2 STARTING   yellow  same as above but still inside the start window
#                        (covers the CNC gate reading "moving" while it opens)
#   3 NO DUST    dk grn  spindle on with override on (dust collection
#                        intentionally off; unchanged from v1.1.0)
#   4 RUNNING    green   spindle on, CNC gate open, vac drawing power
#   5 CHECK GATE red     STOPPING has lasted longer than Stop Stuck Timeout
#                        (default 60 s); held until the gate settles closed or
#                        the spindle turns on again
#   6 STOPPING   orange  from the spindle on->off edge until the CNC gate
#                        actual has read "closed" continuously for Stop Settle
#                        (default 5 s) and the hose gate isn't moving. Any
#                        non-closed reading restarts the settle timer.
#   7 MOVING     orange  either gate actual reads "moving" with no start/stop
#                        phase active; held until both have been non-moving
#                        for Moving Settle (default 2 s) so it doesn't flicker
#   8 IDLE       dk grn  CNC on (Shop CNC Online), spindle off
#   9 OFF        black   CNC off
# Why STOPPING (v1.3.0): after a job the controller closes the CNC gate, the
# valve often springs back off the closed reed ~1.2-1.5 s after the servo
# detaches, and the alignment supervisor re-closes it (unknown -> open ->
# close). In v1.2.0 every one of those flaps flipped the screen between
# dark-green IDLE and orange MOVING. All gate travel after a job now happens
# inside one steady STOPPING phase; once it ends the gates are expected to be
# done moving. Logged stops on 2026-10-18 reached final closed 5.6-14.9 s
# after spindle off.
# Why gate *actual* + vac *power* instead of the desired switches: a gate stuck
# mid-retry or a tripped/clogged/unplugged vac must show red, and the desired
# switches would still say "on". If the vac power sensor is unavailable we
# fall back to the vac switch state rather than flashing a false red.
# compute_state is the single source of truth; refresh_ui applies it, and a
# 1 s interval re-evaluates so the STARTING -> NO DUST timeout fires even when
# no HA state changes arrive.
# ---------------------------------------------------------------------------
globals:
  - id: gate_moving
    type: bool
    restore_value: false
    initial_value: "false"
  - id: spindle_was_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: spindle_on_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # STOPPING phase
  - id: stop_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: stop_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # CNC gate continuously-closed tracking (any non-closed reading resets)
  - id: cnc_closed_flag
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cnc_closed_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # MOVING hold-off after the last moving reading clears
  - id: moving_recent
    type: bool
    restore_value: false
    initial_value: "false"
  - id: moving_end_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: ui_next
    type: int
    restore_value: false
    initial_value: "0"
  - id: ui_state
    type: int
    restore_value: false
    initial_value: "-1"

text_sensor:
  - platform: homeassistant
    id: cnc_gate_actual
    entity_id: ${cnc_gate_actual_entity}
    on_value:
      then:
        - script.execute: update_gate_moving
  - platform: homeassistant
    id: hose_gate_actual
    entity_id: ${hose_gate_actual_entity}
    on_value:
      then:
        - script.execute: update_gate_moving
  - platform: template
    name: "Display State"
    id: ui_status_text
    icon: mdi:list-status
    update_interval: never

number:
  - platform: template
    name: "Start Window"
    id: start_window
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 3
    max_value: 60
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${start_window_s}
    on_value:
      then:
        - script.execute: refresh_ui
  - platform: template
    name: "Vac Run Threshold"
    id: vac_threshold
    icon: mdi:flash-triangle-outline
    entity_category: config
    unit_of_measurement: W
    min_value: 20
    max_value: 1500
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${vac_run_threshold_w}
    on_value:
      then:
        - script.execute: refresh_ui
  - platform: template
    name: "Stop Settle"
    id: stop_settle
    icon: mdi:timer-check-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${stop_settle_s}
    on_value:
      then:
        - script.execute: refresh_ui
  - platform: template
    name: "Stop Stuck Timeout"
    id: stop_stuck
    icon: mdi:timer-alert-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 15
    max_value: 600
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${stop_stuck_s}
    on_value:
      then:
        - script.execute: refresh_ui
  - platform: template
    name: "Moving Settle"
    id: moving_settle
    icon: mdi:timer-sand-paused
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 15
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${moving_settle_s}
    on_value:
      then:
        - script.execute: refresh_ui

interval:
  - interval: 1s
    then:
      - script.execute: compute_state
      - if:
          condition:
            lambda: 'return id(ui_next) != id(ui_state);'
          then:
            - script.execute: refresh_ui

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s
  - platform: homeassistant
    id: spindle_power
    entity_id: ${spindle_power_entity}
    accuracy_decimals: 0
    on_value:
      then:
        - script.execute: refresh_metrics
  - platform: homeassistant
    id: spindle_voltage
    entity_id: ${spindle_voltage_entity}
    accuracy_decimals: 0
    on_value:
      then:
        - script.execute: refresh_metrics
  - platform: homeassistant
    id: spindle_current
    entity_id: ${spindle_current_entity}
    accuracy_decimals: 2
    on_value:
      then:
        - script.execute: refresh_metrics
  # Shop vac real draw (Shelly Plug US Gen4, fast power via HA helper).
  # Drives RUNNING vs NO DUST.
  # The interval above picks up any resulting state change within 1 s.
  - platform: homeassistant
    id: vac_power
    entity_id: ${vac_power_entity}
    accuracy_decimals: 0

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
    icon: mdi:restart

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    frequency: 100Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: display_backlight
    icon: mdi:monitor-dashboard
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

i2c:
  - id: touch_i2c
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

display:
  - platform: mipi_rgb
    id: lcd
    model: GUITION-4848S040
    dimensions:
      width: 480
      height: 480
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    display: lcd
    i2c_id: touch_i2c
    transform:
      mirror_x: true
      mirror_y: true

font:
  - file:
      type: gfonts
      family: "Roboto"
      weight: black
    id: font_hero
    size: 72
    bpp: 4
  # "CHECK GATE" measures ~429 px at 72 pt vs 432 px usable, so that one
  # state uses a 64 pt face to avoid wrapping.
  - file:
      type: gfonts
      family: "Roboto"
      weight: black
    id: font_hero_sm
    size: 64
    bpp: 4
    glyphs: "CHEKGAT "
  - file:
      type: gfonts
      family: "Roboto"
      weight: black
    id: font_watts
    size: 96
    bpp: 4
  - file:
      type: gfonts
      family: "Roboto"
      weight: bold
    id: font_metric
    size: 36
    bpp: 4
  - file:
      type: gfonts
      family: "Roboto"
      weight: medium
    id: font_chip
    size: 18
    bpp: 4

color:
  - id: fg_on
    hex: "FFFFFF"
  - id: fg_off
    hex: "6E6E6E"
  - id: fg_dim
    hex: "4A4A4A"
  - id: bg_off
    hex: "000000"

script:
  - id: update_gate_moving
    then:
      - lambda: |-
          const uint32_t now = millis();
          bool m = (id(cnc_gate_actual).state == "moving") ||
                   (id(hose_gate_actual).state == "moving");
          if (m != id(gate_moving)) {
            id(gate_moving) = m;
            if (!m) {
              id(moving_recent) = true;
              id(moving_end_ms) = now;
            }
            ESP_LOGI("gate", "Gate moving: %s", m ? "YES" : "no");
          }
          // Settle timer: restart on every transition into "closed"; any
          // other reading (moving/unknown/open/fault/unavailable) clears it.
          const bool closed = id(cnc_gate_actual).state == "closed";
          if (closed && !id(cnc_closed_flag)) {
            id(cnc_closed_flag) = true;
            id(cnc_closed_since_ms) = now;
          } else if (!closed) {
            id(cnc_closed_flag) = false;
          }
      - script.execute: refresh_ui

  # States: 0 OFF, 1 IDLE, 2 RUNNING, 3 OVERRIDE (NO DUST, dark green),
  #         4 MOVING, 5 STARTING, 6 NO DUST (red), 7 STOPPING, 8 CHECK GATE
  - id: compute_state
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool spin = id(spindle_active).state;
          const bool ovr = id(override_state).state;
          const bool cnc_on = id(cnc_state).state;
          const bool gate_open = id(cnc_gate_actual).state == "open";
          float thr = id(vac_threshold).state;
          if (std::isnan(thr)) thr = ${vac_run_threshold_w};
          float win_s = id(start_window).state;
          if (std::isnan(win_s)) win_s = ${start_window_s};
          const float pw = id(vac_power).state;
          const bool vac_ok = std::isnan(pw) ? id(shop_vac).state : (pw >= thr);
          const bool in_window =
              spin && (millis() - id(spindle_on_ms)) < (uint32_t) (win_s * 1000.0f);
          float settle_s = id(stop_settle).state;
          if (std::isnan(settle_s)) settle_s = ${stop_settle_s};
          float stuck_s = id(stop_stuck).state;
          if (std::isnan(stuck_s)) stuck_s = ${stop_stuck_s};
          float mset_s = id(moving_settle).state;
          if (std::isnan(mset_s)) mset_s = ${moving_settle_s};
          const bool hose_moving = id(hose_gate_actual).state == "moving";
          // End STOPPING once the CNC gate has been closed for Stop Settle
          // and the hose isn't moving.
          if (id(stop_active) && !spin && id(cnc_closed_flag) && !hose_moving &&
              (now - id(cnc_closed_since_ms)) >= (uint32_t) (settle_s * 1000.0f)) {
            id(stop_active) = false;
            ESP_LOGI("ui", "STOPPING done after %.1f s",
                     (now - id(stop_start_ms)) / 1000.0f);
          }
          // MOVING hold-off expiry
          if (id(moving_recent) && !id(gate_moving) &&
              (now - id(moving_end_ms)) >= (uint32_t) (mset_s * 1000.0f)) {
            id(moving_recent) = false;
          }
          const bool moving_shown = id(gate_moving) || id(moving_recent);
          int s;
          if (spin && !ovr && !(gate_open && vac_ok)) {
            s = in_window ? 5 : 6;
          } else if (spin && ovr) {
            s = 3;
          } else if (spin) {
            s = 2;
          } else if (id(stop_active)) {
            s = ((now - id(stop_start_ms)) >= (uint32_t) (stuck_s * 1000.0f)) ? 8 : 7;
          } else if (moving_shown) {
            s = 4;
          } else if (cnc_on) {
            s = 1;
          } else {
            s = 0;
          }
          id(ui_next) = s;

  - id: refresh_metrics
    then:
      - lvgl.label.update:
          id: power_label
          text:
            format: "%.0f W"
            args: [id(spindle_power).state]
            if_nan: "-- W"
      - lvgl.label.update:
          id: volt_label
          text:
            format: "%.0f V"
            args: [id(spindle_voltage).state]
            if_nan: "-- V"
      - lvgl.label.update:
          id: amp_label
          text:
            format: "%.2f A"
            args: [id(spindle_current).state]
            if_nan: "-- A"

  # Single redraw path. Theme per state:
  #   bg       hero/metrics  chip on   chip off  OVR on
  #   OFF      000000  6E6E6E/FFFFFF FFFFFF 4A4A4A F5A623
  #   IDLE     0A3A1A  FFFFFF        FFFFFF 5C7D66 F5A623
  #   OVERRIDE 006828  FFFFFF        FFFFFF 3E8A55 F5A623
  #   RUNNING  00AE42  000000        000000 00632A 7A0000
  #   MOVING   FF7A00  000000        000000 8A4200 600000
  #   STARTING FFE000  000000        000000 8A7900 8B0000
  #   NO DUST  C62828  FFFFFF        FFFFFF 5A0A0A FFD54F
  #   STOPPING FF7A00  000000        000000 8A4200 600000
  #   CHECK GT C62828  FFFFFF        FFFFFF 5A0A0A FFD54F
  - id: refresh_ui
    then:
      - script.execute: compute_state
      - lambda: |-
          if (id(ui_next) != id(ui_state)) {
            static const char *const names[] = {"OFF", "IDLE", "RUNNING", "OVERRIDE",
                                                "MOVING", "STARTING", "NO DUST",
                                                "STOPPING", "CHECK GATE"};
            ESP_LOGI("ui", "State -> %s", names[id(ui_next)]);
            id(ui_status_text).publish_state(names[id(ui_next)]);
          }
          id(ui_state) = id(ui_next);
      - if:
          condition:
            lambda: 'return id(ui_state) == 8;'
          then:
            - lvgl.label.update:
                id: hero_label
                text_font: font_hero_sm
          else:
            - lvgl.label.update:
                id: hero_label
                text_font: font_hero
      - lvgl.widget.update:
          id: page_root
          bg_color: !lambda |-
            static const uint32_t c[] = {0x000000, 0x0A3A1A, 0x00AE42, 0x006828,
                                         0xFF7A00, 0xFFE000, 0xC62828,
                                         0xFF7A00, 0xC62828};
            return lv_color_hex(c[id(ui_state)]);
      - lvgl.label.update:
          id: hero_label
          text: !lambda |-
            static const char *const t[] = {"OFF", "IDLE", "RUNNING", "NO DUST",
                                            "MOVING", "STARTING", "NO DUST",
                                            "STOPPING", "CHECK GATE"};
            return std::string(t[id(ui_state)]);
          text_color: !lambda |-
            static const uint32_t c[] = {0x6E6E6E, 0xFFFFFF, 0x000000, 0xFFFFFF,
                                         0x000000, 0x000000, 0xFFFFFF,
                                         0x000000, 0xFFFFFF};
            return lv_color_hex(c[id(ui_state)]);
      - lvgl.label.update:
          id: power_label
          text_color: !lambda |-
            static const uint32_t c[] = {0xFFFFFF, 0xFFFFFF, 0x000000, 0xFFFFFF,
                                         0x000000, 0x000000, 0xFFFFFF,
                                         0x000000, 0xFFFFFF};
            return lv_color_hex(c[id(ui_state)]);
      - lvgl.label.update:
          id: volt_label
          text_color: !lambda |-
            static const uint32_t c[] = {0xFFFFFF, 0xFFFFFF, 0x000000, 0xFFFFFF,
                                         0x000000, 0x000000, 0xFFFFFF,
                                         0x000000, 0xFFFFFF};
            return lv_color_hex(c[id(ui_state)]);
      - lvgl.label.update:
          id: amp_label
          text_color: !lambda |-
            static const uint32_t c[] = {0xFFFFFF, 0xFFFFFF, 0x000000, 0xFFFFFF,
                                         0x000000, 0x000000, 0xFFFFFF,
                                         0x000000, 0xFFFFFF};
            return lv_color_hex(c[id(ui_state)]);
      - lvgl.label.update:
          id: gate_label
          text_color: !lambda |-
            static const uint32_t on[] = {0xFFFFFF, 0xFFFFFF, 0x000000, 0xFFFFFF,
                                          0x000000, 0x000000, 0xFFFFFF,
                                          0x000000, 0xFFFFFF};
            static const uint32_t off[] = {0x4A4A4A, 0x5C7D66, 0x00632A, 0x3E8A55,
                                           0x8A4200, 0x8A7900, 0x5A0A0A,
                                           0x8A4200, 0x5A0A0A};
            return lv_color_hex(id(blast_gate).state ? on[id(ui_state)] : off[id(ui_state)]);
      - lvgl.label.update:
          id: vac_label
          text_color: !lambda |-
            static const uint32_t on[] = {0xFFFFFF, 0xFFFFFF, 0x000000, 0xFFFFFF,
                                          0x000000, 0x000000, 0xFFFFFF,
                                          0x000000, 0xFFFFFF};
            static const uint32_t off[] = {0x4A4A4A, 0x5C7D66, 0x00632A, 0x3E8A55,
                                           0x8A4200, 0x8A7900, 0x5A0A0A,
                                           0x8A4200, 0x5A0A0A};
            return lv_color_hex(id(shop_vac).state ? on[id(ui_state)] : off[id(ui_state)]);
      - lvgl.label.update:
          id: ovr_label
          text: "OVR"
          text_color: !lambda |-
            static const uint32_t on[] = {0xF5A623, 0xF5A623, 0x7A0000, 0xF5A623,
                                          0x600000, 0x8B0000, 0xFFD54F,
                                          0x600000, 0xFFD54F};
            static const uint32_t off[] = {0x4A4A4A, 0x5C7D66, 0x00632A, 0x3E8A55,
                                           0x8A4200, 0x8A7900, 0x5A0A0A,
                                           0x8A4200, 0x5A0A0A};
            return lv_color_hex(id(override_state).state ? on[id(ui_state)] : off[id(ui_state)]);
      - script.execute: refresh_metrics

  - id: tap_override
    mode: single
    then:
      - logger.log: "Override tap"
      - homeassistant.action:
          action: button.press
          data:
            entity_id: ${override_toggle_entity}
      - delay: 1s
      - script.execute: refresh_ui

lvgl:
  id: lvgl1
  displays:
    - lcd
  touchscreens:
    - touch
  rotation: 180
  color_depth: 16
  buffer_size: 25%
  bg_color: bg_off
  default_font: font_chip
  log_level: WARN
  pages:
    - id: page_root
      bg_color: bg_off
      scrollable: false
      clickable: true
      pad_all: 24
      on_short_click:
        then:
          - script.execute: tap_override
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: SPACE_BETWEEN
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - label:
            id: hero_label
            width: 100%
            text: "OFF"
            text_font: font_hero
            text_color: fg_off
            text_align: CENTER
            clickable: false
        - obj:
            width: 100%
            height: SIZE_CONTENT
            pad_all: 0
            bg_opa: TRANSP
            border_width: 0
            clickable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 4
            widgets:
              - label:
                  id: power_label
                  width: 100%
                  text: "-- W"
                  text_font: font_watts
                  text_color: fg_on
                  text_align: CENTER
                  clickable: false
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  pad_all: 0
                  pad_left: 12
                  pad_right: 12
                  bg_opa: TRANSP
                  border_width: 0
                  clickable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: volt_label
                        text: "-- V"
                        text_font: font_metric
                        text_color: fg_on
                        clickable: false
                    - label:
                        id: amp_label
                        text: "-- A"
                        text_font: font_metric
                        text_color: fg_on
                        clickable: false
        - obj:
            width: 100%
            height: SIZE_CONTENT
            pad_all: 0
            bg_opa: TRANSP
            border_width: 0
            clickable: false
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
            widgets:
              - label:
                  id: gate_label
                  text: "GATE"
                  text_font: font_chip
                  text_color: fg_dim
                  clickable: false
              - label:
                  id: vac_label
                  text: "VAC"
                  text_font: font_chip
                  text_color: fg_dim
                  clickable: false
              - label:
                  id: ovr_label
                  text: "OVR"
                  text_font: font_chip
                  text_color: fg_dim
                  clickable: false
