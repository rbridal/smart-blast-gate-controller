# Blast Gate C — Shapeoko + Spot Hose (independent valves)
# Dual MG996R + RC-34A-style reed stops (open + closed per valve)
# Board: ESP32 DevKit (38-pin)
#
# Desired vs Actual alignment supervisor:
#   Desired = HA switches CNC/Hose Blast Gate (command only; never overwritten by reeds)
#   Actual  = text_sensor from reeds + motion (closed|open|moving|unknown|fault)
#   Aligned = desired matches unambiguous actual
#   Supervisor corrects misalignment (grace/debounce/cooldown/max retries) when
#   "Alignment correction" is ON.
#
# Reeds: one lead → GND, other → GPIO pull-up.
#   Magnet at stop → GPIO LOW. inverted: true → binary ON = at that stop.
# Detach policy: HOLD PWM while open; only auto-detach after closing
#   ("Closed detach time", 0 = also hold when closed). Shared for both servos.
#
# Open/close limits + last-gate close delay are HA Number entities
# (restore_value on ESP32 NVS). Tweak in HA — no recompile.
#
# Closing the last open gate (other already closed): wait last_gate_close_delay_s
# so vac can spin down before seating against suction.
# If the other gate is still open: close immediately.
#
# Boot: wait for 5V, apply closed-detach, then reseat both valves closed.
#
# REDACTED: API encryption key and secrets replaced with placeholders.
# Use your own !secret references in production.

substitutions:
  device_name: smart-blast-gate
  friendly_name: Smart Blast Gate Controller

  boot_power_delay: "2s"
  seat_delay: "1s"
  reed_settle: "300ms"

  # Servos stay on GPIO18 / GPIO19 — do not move.
  # Reed pins chosen to avoid servo pins and common strapping pins.
  pin_cnc_reed_closed: GPIO21
  pin_cnc_reed_open: GPIO22
  pin_hose_reed_closed: GPIO23
  pin_hose_reed_open: GPIO25

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: ${boot_power_delay}
      - script.execute: apply_detach_closed_cnc
      - script.execute: apply_detach_closed_hose
      - script.execute: seat_both_closed

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret smart_blast_gate__api_encryption_key  # REDACTED — generate your own

ota:
  - platform: esphome
    password: !secret cnc_blast_gate__ota_password

wifi:
  ssid: !secret wifi_ssid_shop
  password: !secret wifi_password_shop

captive_portal:

globals:
  - id: motion_busy_cnc
    type: bool
    restore_value: false
    initial_value: "false"

  - id: motion_busy_hose
    type: bool
    restore_value: false
    initial_value: "false"

  - id: grace_until_cnc
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: grace_until_hose
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: misaligned_since_cnc
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: misaligned_since_hose
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: retry_count_cnc
    type: int
    restore_value: false
    initial_value: "0"

  - id: retry_count_hose
    type: int
    restore_value: false
    initial_value: "0"

  - id: cooldown_until_cnc
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: cooldown_until_hose
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: align_fault_cnc
    type: bool
    restore_value: false
    initial_value: "false"

  - id: align_fault_hose
    type: bool
    restore_value: false
    initial_value: "false"

packages:
  p1: !include cnc-bg-p1.yaml
  p2a: !include cnc-bg-p2a.yaml
  p2b: !include cnc-bg-p2b.yaml
  p3a: !include cnc-bg-p3a.yaml
  p3b: !include cnc-bg-p3b.yaml
