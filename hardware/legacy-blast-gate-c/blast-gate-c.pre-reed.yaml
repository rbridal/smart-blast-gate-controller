# Blast Gate C — Shapeoko + Spot Hose (independent valves)
# Dual MG996R — no reeds, no desk LEDs
# Board: ESP32 DevKit (38-pin)
#
# Open/close limits + last-gate close delay are HA Number entities
# (restore_value on ESP32 NVS). Tweak in HA — no recompile.
#
# Closing the last open gate (other already closed): wait last_gate_close_delay_s
# so vac can spin down before seating against suction.
# If the other gate is still open: close immediately.
#
# Hard stops (printed): set % to land on/near the stop.
# auto_detach after move so servos are not stalled against the stop forever.
# Boot: wait for 5V, then double-close to reseat both valves.

substitutions:
  device_name: smart-blast-gate
  friendly_name: Smart Blast Gate Controller

  boot_power_delay: "2s"
  seat_delay: "1s"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: ${boot_power_delay}
      - script.execute: seat_both_closed

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key  # REDACTED

ota:
  - platform: esphome
    password: !secret cnc_blast_gate__ota_password

wifi:
  ssid: !secret wifi_ssid_shop
  password: !secret wifi_password_shop

captive_portal:

output:
  - platform: ledc
    id: servo_cnc_pwm
    pin: GPIO18
    frequency: 50 Hz

  - platform: ledc
    id: servo_hose_pwm
    pin: GPIO19
    frequency: 50 Hz

servo:
  - id: servo_cnc
    output: servo_cnc_pwm
    auto_detach_time: 1.5s
    transition_length: 800ms

  - id: servo_hose
    output: servo_hose_pwm
    auto_detach_time: 1.5s
    transition_length: 800ms

script:
  - id: seat_both_closed
    mode: restart
    then:
      - switch.template.publish:
          id: valve_cnc
          state: OFF
      - switch.template.publish:
          id: valve_hose
          state: OFF
      - servo.write:
          id: servo_cnc
          level: !lambda "return id(cnc_closed_pct).state / 100.0;"
      - servo.write:
          id: servo_hose
          level: !lambda "return id(hose_closed_pct).state / 100.0;"
      - delay: ${seat_delay}
      - servo.write:
          id: servo_cnc
          level: !lambda "return id(cnc_closed_pct).state / 100.0;"
      - servo.write:
          id: servo_hose
          level: !lambda "return id(hose_closed_pct).state / 100.0;"

  - id: seat_cnc_open
    mode: restart
    then:
      - servo.write:
          id: servo_cnc
          level: !lambda "return id(cnc_open_pct).state / 100.0;"
      - delay: ${seat_delay}
      - servo.write:
          id: servo_cnc
          level: !lambda "return id(cnc_open_pct).state / 100.0;"

  - id: seat_cnc_closed
    mode: restart
    then:
      # Last open gate (hose already closed) → wait for vac coast-down
      - if:
          condition:
            switch.is_off: valve_hose
          then:
            - delay: !lambda |-
                return (uint32_t)(id(last_gate_close_delay_s).state * 1000.0f);
      - servo.write:
          id: servo_cnc
          level: !lambda "return id(cnc_closed_pct).state / 100.0;"
      - delay: ${seat_delay}
      - servo.write:
          id: servo_cnc
          level: !lambda "return id(cnc_closed_pct).state / 100.0;"

  - id: seat_hose_open
    mode: restart
    then:
      - servo.write:
          id: servo_hose
          level: !lambda "return id(hose_open_pct).state / 100.0;"
      - delay: ${seat_delay}
      - servo.write:
          id: servo_hose
          level: !lambda "return id(hose_open_pct).state / 100.0;"

  - id: seat_hose_closed
    mode: restart
    then:
      # Last open gate (CNC already closed) → wait for vac coast-down
      - if:
          condition:
            switch.is_off: valve_cnc
          then:
            - delay: !lambda |-
                return (uint32_t)(id(last_gate_close_delay_s).state * 1000.0f);
      - servo.write:
          id: servo_hose
          level: !lambda "return id(hose_closed_pct).state / 100.0;"
      - delay: ${seat_delay}
      - servo.write:
          id: servo_hose
          level: !lambda "return id(hose_closed_pct).state / 100.0;"

switch:
  - platform: template
    name: "CNC Blast Gate"
    id: valve_cnc
    icon: mdi:robot-industrial
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: seat_cnc_open
    turn_off_action:
      - script.execute: seat_cnc_closed

  - platform: template
    name: "Hose Blast Gate"
    id: valve_hose
    icon: mdi:circle-slice-8
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: seat_hose_open
    turn_off_action:
      - script.execute: seat_hose_closed

number:
  # ---- Vac coast-down when closing the last open gate (edit in HA) ----
  - platform: template
    name: "Last-gate close delay"
    id: last_gate_close_delay_s
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 0
    max_value: 15
    step: 0.5
    initial_value: 3
    optimistic: true
    restore_value: true
    mode: BOX

  # ---- Persisted limits (edit in HA, no reflash) ----
  - platform: template
    name: "CNC open %"
    id: cnc_open_pct
    icon: mdi:arrow-up-bold
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 45
    optimistic: true
    restore_value: true
    mode: BOX
    set_action:
      - if:
          condition:
            switch.is_on: valve_cnc
          then:
            - script.execute: seat_cnc_open

  - platform: template
    name: "CNC closed %"
    id: cnc_closed_pct
    icon: mdi:arrow-down-bold
    min_value: -100
    max_value: 100
    step: 1
    initial_value: -69
    optimistic: true
    restore_value: true
    mode: BOX
    set_action:
      - if:
          condition:
            switch.is_off: valve_cnc
          then:
            - script.execute: seat_cnc_closed

  - platform: template
    name: "Hose open %"
    id: hose_open_pct
    icon: mdi:arrow-up-bold
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 69
    optimistic: true
    restore_value: true
    mode: BOX
    set_action:
      - if:
          condition:
            switch.is_on: valve_hose
          then:
            - script.execute: seat_hose_open

  - platform: template
    name: "Hose closed %"
    id: hose_closed_pct
    icon: mdi:arrow-down-bold
    min_value: -100
    max_value: 100
    step: 1
    initial_value: -42
    optimistic: true
    restore_value: true
    mode: BOX
    set_action:
      - if:
          condition:
            switch.is_off: valve_hose
          then:
            - script.execute: seat_hose_closed

  # ---- Live jog (does not change saved limits) ----
  - platform: template
    name: "Jog CNC servo %"
    id: jog_cnc
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    mode: BOX
    set_action:
      - servo.write:
          id: servo_cnc
          level: !lambda "return x / 100.0;"

  - platform: template
    name: "Jog Hose servo %"
    id: jog_hose
    min_value: -100
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    mode: BOX
    set_action:
      - servo.write:
          id: servo_hose
          level: !lambda "return x / 100.0;"

button:
  - platform: template
    name: "Reseat both closed"
    icon: mdi:reload
    on_press:
      - script.execute: seat_both_closed
