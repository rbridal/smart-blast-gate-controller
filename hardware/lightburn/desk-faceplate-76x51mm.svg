<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="76.2mm" height="50.8mm" viewBox="0 0 76.2 50.8">
  <!-- LightBurn: #000000 stroke = Cut, #0000FF fill = Engrave -->
  <!-- Outer plate -->
  <rect x="0.5" y="0.5" width="75.2" height="49.8" rx="2" ry="2"
        fill="none" stroke="#000000" stroke-width="0.15"/>

  <!-- Mount holes 3mm (corners) — Cut -->
  <circle cx="6" cy="6" r="1.5" fill="none" stroke="#000000" stroke-width="0.15"/>
  <circle cx="70.2" cy="6" r="1.5" fill="none" stroke="#000000" stroke-width="0.15"/>
  <circle cx="6" cy="44.8" r="1.5" fill="none" stroke="#000000" stroke-width="0.15"/>
  <circle cx="70.2" cy="44.8" r="1.5" fill="none" stroke="#000000" stroke-width="0.15"/>

  <!-- LEFT LED hole 5mm — green / CNC -->
  <circle cx="24" cy="22" r="2.5" fill="none" stroke="#000000" stroke-width="0.15"/>
  <!-- RIGHT LED hole 5mm — red / HOSE -->
  <circle cx="52.2" cy="22" r="2.5" fill="none" stroke="#000000" stroke-width="0.15"/>

  <!-- Title (engrave) centered top -->
  <text x="38.1" y="9" text-anchor="middle" font-family="Arial" font-size="5"
        font-weight="bold" fill="#0000FF">DUST GATE</text>

  <!-- LEFT labels under left LED -->
  <text x="24" y="33" text-anchor="middle" font-family="Arial" font-size="5.5"
        font-weight="bold" fill="#0000FF">CNC</text>
  <text x="24" y="38.5" text-anchor="middle" font-family="Arial" font-size="3.2"
        fill="#0000FF">green</text>

  <!-- RIGHT labels under right LED -->
  <text x="52.2" y="33" text-anchor="middle" font-family="Arial" font-size="5.5"
        font-weight="bold" fill="#0000FF">HOSE</text>
  <text x="52.2" y="38.5" text-anchor="middle" font-family="Arial" font-size="3.2"
        fill="#0000FF">red</text>

  <!-- Footer -->
  <text x="38.1" y="46.5" text-anchor="middle" font-family="Arial" font-size="2.6"
        fill="#0000FF">Blast Gate C · Shapeoko</text>
</svg>
